openapi: "3.0.3"
info:
  title: EC Backend API
  version: "1.0.0"
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: OK
  /members:
    get:
      operationId: listMembers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
components:
  schemas:
    Member:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
    CreateMemberRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
